<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' gp: blob: data:; connect-src 'self' gp:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>GridPhoto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="grid">
    <div id="welcome">
      <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1>GridPhoto</h1>
      <p class="tagline">Drop photos or a folder anywhere to begin</p>
      <div class="welcome-actions">
        <button class="primary" data-cmd="add_folder">Open folder</button>
        <button data-cmd="add_files">Add photos</button>
        <button data-cmd="open_playlist">Open grid</button>
      </div>
      <p class="keys">
        <kbd>Space</kbd> slideshow &nbsp;·&nbsp; <kbd>1</kbd>–<kbd>5</kbd> rate &nbsp;·&nbsp;
        <kbd>P</kbd> pick &nbsp;·&nbsp; <kbd>X</kbd> reject &nbsp;·&nbsp; <kbd>F1</kbd> all shortcuts
      </p>
    </div>
  </main>

  <div id="group-chip" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.9-3.6 3.7-5.8 7-5.8s6.1 2.2 7 5.8"/></svg>
    <span class="name"></span>
    <button title="Back to all photos (Esc)">All photos</button>
  </div>

  <div id="selection-bar" hidden role="toolbar" aria-label="Selection">
    <span class="count"></span>
    <button data-sel="all" title="Select all (Ctrl+A)">Select all</button>
    <button data-sel="folder" title="Add the selected photos to a folder">Add to folder</button>
    <button data-sel="close" title="Remove and delete GridPhoto’s copies, Undo available (Ctrl+W)">Close</button>
    <button data-sel="delete" class="danger" title="Delete GridPhoto’s copies, originals are not touched (Delete)">Delete</button>
    <button data-sel="clear" class="icon-btn" title="Clear selection (Esc)" aria-label="Clear selection">✕</button>
  </div>

  <nav id="toolbar" aria-label="Toolbar">
    <button data-cmd="add_files" title="Add photos (Ctrl+N)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 2.5-2.5L20 18"/></svg>
    </button>
    <button data-cmd="add_folder" title="Add folder (Ctrl+Shift+A)">
      <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
    </button>
    <button data-cmd="open_playlist" title="Open grid (Ctrl+O)">
      <svg viewBox="0 0 24 24"><path d="M3 18V7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h6.5A2.5 2.5 0 0 1 20 9.5V10"/><path d="M3 18l2.6-6.2A2 2 0 0 1 7.4 10.5H21l-3 7.8a2 2 0 0 1-1.9 1.2H4.5A1.5 1.5 0 0 1 3 18z"/></svg>
    </button>
    <button data-cmd="save_playlist" title="Save grid (Ctrl+S)">
      <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v11.5A1.5 1.5 0 0 1 17.5 20h-11A1.5 1.5 0 0 1 5 18.5z" transform="translate(-.5 0)"/><path d="M8 4v4.5h7V4M8 20v-6h8v6"/></svg>
    </button>
    <span class="sep"></span>
    <button data-cmd="layout_toggle" title="Layout">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="10" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="6" rx="1.5"/><rect x="3" y="16" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="12" width="7.5" height="9" rx="1.5"/></svg>
    </button>
    <button data-cmd="filter_menu" title="Filter">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
    </button>
    <span class="count" aria-live="polite"></span>
    <button data-cmd="faces" title="Find people (Ctrl+Shift+F)">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5"/><circle cx="17" cy="9.5" r="2.6"/><path d="M16.5 14.2c2.6.2 4.4 2 5 4.8"/></svg>
    </button>
    <button data-cmd="new_folder" title="New folder: sort people yourself (Ctrl+Shift+N)">
      <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M12 10.5v6M9 13.5h6"/></svg>
    </button>
    <span class="sep"></span>
    <button data-cmd="present" title="Slideshow of hovered photo (Space)">
      <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
    </button>
    <button data-cmd="background" title="Background (Ctrl+B)">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.4-2-.5-1.3.3-2.5 1.7-2.5H17a4 4 0 0 0 4-4C21 7 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
    </button>
    <button data-cmd="fullscreen" title="Fullscreen (F)">
      <svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
    </button>
    <button data-cmd="settings" title="Settings (F6)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
